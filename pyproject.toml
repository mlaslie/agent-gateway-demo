[project]
name = "agdemo"
version = "0.1.0"
description = "Agent Gateway & Agent Registry demo: CLI, policy engine and UI backend"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "google-auth>=2.30",
  "google-cloud-aiplatform[agent_engines,adk]>=1.120",
  "google-adk[a2a]>=1.15",
  "a2a-sdk[http-server]>=0.3",
  "mcp>=1.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
]

[project.scripts]
agdemo = "agdemo_core.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agdemo_core", "ui/backend/agdemo_ui"]
