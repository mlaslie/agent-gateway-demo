id: grant
order: 3
title: "Grant Payroll: private path"
subtitle: "200, serverIp = PSC endpoint (10.x)"
description: |
  Grant Payroll Agent's Agent Identity roles/iap.egressor on Payroll MCP (all tools, or read-only only).
  About 2 minutes later the call succeeds, and the gateway log entry's httpRequest.serverIp is the private
  PSC endpoint IP: the request took the private path through your VPC. With the read-only grant,
  update_bank_details stays 403: tool-level policy works over the private path too. Benefits stays 403.
flow: egress
nodes: [orchestrator, egress_gateway, registry, payroll-mcp]
preconditions: [gw-egress]
policies: [payroll-readonly, payroll-readonly-hints, payroll-all]
tests:
  - id: payslip
    label: "Read a payslip"
    prompt: "Show me jdoe's September payslip."
    probes: [{edge: "payroll-mcp:get_payslip"}]
  - id: bank-details
    label: "Change bank details"
    prompt: "Update jdoe's bank account to IBAN 0000."
    probes: [{edge: "payroll-mcp:update_bank_details"}]
