id: through-gateway
order: 2
title: "Through the gateway"
subtitle: "Route + registry entry, no permission → 403"
description: |
  Attach the VPC-enabled gateway. Its connectivity template gives it a network attachment in your VPC, where
  run.app resolves to the PSC endpoint, so Payroll MCP is now reachable. Both servers are also registered in
  Agent Registry (open the registry: Payroll has both run.app URL forms and its tool spec). But no identity
  holds roles/iap.egressor on them, so default deny answers 403 for both: a route and a registry entry
  aren't permission.
flow: egress
nodes: [orchestrator, egress_gateway, registry, payroll-mcp, benefits-mcp]
preconditions: [gw-egress]
policies: [gw-egress]
tests:
  - id: payslip-no-grant
    label: "Payslip through the gateway"
    prompt: "Show me jdoe's September payslip."
    probes: [{edge: "payroll-mcp:get_payslip"}]
