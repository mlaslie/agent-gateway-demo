id: helpdesk
name: IT / HR Helpdesk
description: >
  An internal helpdesk agent that resolves employee requests using a knowledge-base agent,
  an HR-records agent, a ticketing MCP server and a directory MCP server.

orchestrator:
  id: helpdesk-agent
  display_name: Helpdesk Agent
  description: Employee-facing IT/HR helpdesk agent on Agent Runtime
  instruction: |
    You are the company IT/HR helpdesk agent. Help employees with IT and HR questions.
    Use list_capabilities to see which remote agents and MCP tools exist.
    - Use call_agent("kb-agent", ...) for how-to and policy questions.
    - Use call_agent("hr-records-agent", ...) for employee record questions.
    - Use call_mcp_tool("tickets-mcp", ...) to look up or change support tickets.
    - Use call_mcp_tool("directory-mcp", ...) to look up users or reset passwords.
    Every tool returns an "outcome". If the outcome is "denied" or "blocked", tell the user plainly
    that access was blocked by policy (name the agent or tool) and do not retry another way.

# A second Agent Runtime agent on the same shared Agent Gateway (scenario 7, docs/CONTRACTS.md §12).
# Its own engine and Agent Identity; policies with params.source: hr-assistant apply to it.
additional_orchestrators:
  - id: hr-assistant
    display_name: HR Assistant
    description: HR-staff-facing assistant on Agent Runtime (employee records)
    instruction: |
      You are the HR assistant for the company's HR staff. Help them with employee records:
      job titles, managers, salaries and performance ratings.
      Use list_capabilities to see which remote agents and MCP tools exist.
      - Use call_agent("hr-records-agent", ...) for employee record questions.
      - You may also use call_agent("kb-agent", ...) for HR policy and how-to questions.
      Every tool returns an "outcome". If the outcome is "denied" or "blocked", tell the user plainly
      that access was blocked by policy (name the agent or tool) and do not retry another way.

components:
  - {id: kb-agent, kind: a2a_agent, role_label: "A2A agent"}
  - {id: hr-records-agent, kind: a2a_agent, role_label: "A2A agent"}
  - {id: tickets-mcp, kind: mcp_server, role_label: "MCP server"}
  - {id: directory-mcp, kind: mcp_server, role_label: "MCP server"}

policies:
  - id: gw-egress
    text: "All of Helpdesk Agent's outbound traffic goes through Agent Gateway (default: deny everything)."
    type: gateway_attach
    params: {path: egress}
    explain: Binds the Agent Runtime engine to the egress gateway. Unregistered or unauthorized destinations get 403.
  - id: gw-ingress
    text: "All calls to Helpdesk Agent come in through Agent Gateway, which screens them with Model Armor when it is on."
    type: gateway_attach
    params: {path: ingress}
  - id: allow-kb
    text: "Helpdesk Agent can talk to KB Agent over A2A."
    type: a2a_allow
    params: {target: kb-agent}
  - id: allow-hr
    text: "Helpdesk Agent can talk to HR Records Agent over A2A."
    type: a2a_allow
    params: {target: hr-records-agent}
  - id: tickets-readonly
    text: "Helpdesk Agent can only use Tickets MCP's read-only tools (listed by name)."
    type: mcp_tool_allow
    params: {target: tickets-mcp, read_only: true}
    explain: Conditional egressor binding that lists the allowed tool names (list_tickets, get_ticket). A new tool stays blocked until it's added to the list.
  - id: tickets-readonly-hints
    text: "Helpdesk Agent can only use Tickets MCP tools annotated read-only (MCP readOnlyHint)."
    type: mcp_tool_allow
    params: {target: tickets-mcp, read_only: true, use_annotation: true}
    explain: Conditional egressor binding on the iap.googleapis.com/mcp.tool.isReadOnly attribute, which the gateway takes from the readOnlyHint in the tool spec registered in Agent Registry. No tool names in the policy; a new tool annotated read-only is allowed automatically.
  - id: tickets-all
    text: "Helpdesk Agent can use every Tickets MCP tool, including write and delete."
    type: mcp_server_allow
    params: {target: tickets-mcp}
  - id: allow-directory
    text: "Helpdesk Agent can use the Directory MCP server."
    type: mcp_server_allow
    params: {target: directory-mcp}
  # ---- HR Assistant (additional orchestrator, scenario 7): same gateway, its own Agent Identity
  - id: gw-egress-hr
    text: "All of HR Assistant's outbound traffic goes through the same Agent Gateway (default: deny everything)."
    type: gateway_attach
    params: {path: egress, source: hr-assistant}
    explain: Binds HR Assistant's Agent Runtime engine to the same shared egress gateway as Helpdesk Agent.
  - id: hr-assistant-allow-hr
    text: "HR Assistant can talk to HR Records Agent over A2A."
    type: a2a_allow
    params: {target: hr-records-agent, source: hr-assistant}
    explain: Grants roles/iap.egressor to HR Assistant's Agent Identity (not Helpdesk Agent's) on HR Records Agent's Agent Registry entry.
  - id: hr-assistant-allow-kb
    text: "HR Assistant can talk to KB Agent over A2A."
    type: a2a_allow
    params: {target: kb-agent, source: hr-assistant}
