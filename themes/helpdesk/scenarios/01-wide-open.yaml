id: wide-open
order: 1
title: "Wide open"
subtitle: "Agent Runtime → anything"
description: |
  Helpdesk Agent runs on Agent Runtime with no Agent Gateway. It finds the agents and MCP servers in
  Agent Registry and calls them directly. Nothing governs what it can reach: confidential HR data,
  destructive ticket tools and password resets are all available.
flow: egress
preconditions: []
policies: [gw-egress]
tests:
  - id: everything
    label: "Probe every connection"
    prompt: "Check every agent and tool you can reach and tell me which ones worked."
    probes: [{edge: kb-agent}, {edge: hr-records-agent}, {edge: "tickets-mcp:get_ticket"},
             {edge: "tickets-mcp:delete_ticket"}, {edge: "directory-mcp:lookup_user"}, {edge: "directory-mcp:reset_password"}]
  - id: salary
    label: "Ask for a salary"
    prompt: "What does jdoe earn?"
    probes: [{edge: hr-records-agent}]
